name: Release

# Builds, signs and publishes a GitHub Release with the artifacts stores and
# direct downloads need:
#   TheCat-<ver>-ARM-ZeroHub.apk        direct ARM APK (THE priority build)
#   TheCat-<ver>-ZeroHub.apk            direct all-ABIs APK
#   TheCat-<ver>-ZeroHub.aab            direct Android App Bundle (all ABIs)
#   TheCat-<ver>-Bazaar-ARM-ZeroHub.apk Bazaar ARM APK (sideload / manual install)
#   TheCat-<ver>-Bazaar-ZeroHub.apk     Bazaar all-ABIs APK
#   TheCat-<ver>-Bazaar-ZeroHub.aab     Bazaar App Bundle (all ABIs)
# AABs are what Play-style stores want nowadays: one bundle carries every
# ABI/density and the store serves per-device splits. The Bazaar APKs are for
# sideloading and for Bazaar's APK upload path, which does not take an AAB.
#
# Triggers: manual run (Actions tab), or push a tag starting with v.
# Signing material comes from repo secrets (KEYSTORE_B64 + RELEASE_* creds).
#
# Two jobs on purpose: the native build takes ~1h, so its outputs are kept as
# an artifact and the publish step runs in its own job — a release hiccup
# re-runs in seconds ("Re-run failed jobs") instead of rebuilding everything.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty for v<versionName>-<versionCode>)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  catnet:
    # The AAR is a build output the repo links as a plain file. Build it here
    # rather than reuse the committed one, so a release can never ship a
    # catnet older than the source it was cut from. Its own workflow
    # (catnet-aar.yml) covers ordinary pushes; this is the release guard.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: network-base/go.mod
          cache-dependency-path: network-base/go.sum

      - name: Set up NDK
        env:
          NDK_VERSION: '27.2.12479018'
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build the AAR
        run: scripts/build-catnet-aar.sh

      - name: Check the Java API matches the app
        run: |
          set -euo pipefail
          # The app's javac is the first thing that would notice a missing or
          # wrongly packaged class, 40 minutes into the native build.
          unzip -p TMessagesProj/libs/catnet.aar classes.jar > /tmp/classes.jar
          unzip -Z1 /tmp/classes.jar | grep -qx 'org/telegram/thecat/catnet/mobile/Client.class' || {
            echo "ERROR: CatNetResolver imports org.telegram.thecat.catnet.mobile.*, which the AAR does not contain"
            exit 1
          }

          # A class being present is not the same as the method being present.
          # gobind renames on the way to Java — ConfigJSON becomes configJSON,
          # not configJson — and the wrong spelling costs the full native build
          # before javac says anything. Check every call site here instead.
          rm -rf /tmp/api && mkdir -p /tmp/api/cls
          unzip -q -o /tmp/classes.jar -d /tmp/api/cls
          javap -classpath /tmp/api/cls org.telegram.thecat.catnet.mobile.Client \
            org.telegram.thecat.catnet.mobile.Mobile \
            | grep -oE ' [a-zA-Z_][a-zA-Z_0-9]*\(' | tr -d ' (' | sort -u > /tmp/api/have.txt
          grep -ohE '(client|Mobile)\.[a-zA-Z_][a-zA-Z_0-9]*\(' \
            TMessagesProj/src/main/java/org/telegram/thecat/CatNetResolver.java \
            | sed -E 's/^(client|Mobile)\.//; s/\($//' | sort -u > /tmp/api/want.txt
          missing="$(comm -23 /tmp/api/want.txt /tmp/api/have.txt)"
          if [ -n "$missing" ]; then
            echo "ERROR: CatNetResolver calls methods the AAR does not expose:"
            echo "$missing" | sed 's/^/  /'
            echo
            echo "The AAR exposes:"
            sed 's/^/  /' /tmp/api/have.txt
            exit 1
          fi
          echo "All $(wc -l < /tmp/api/want.txt) call sites match the AAR."

      - name: Hand the AAR to the build job
        uses: actions/upload-artifact@v4
        with:
          name: catnet-aar
          path: TMessagesProj/libs/catnet.aar
          if-no-files-found: error

  build:
    needs: catnet
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      code: ${{ steps.meta.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch the freshly built AAR
        uses: actions/download-artifact@v4
        with:
          name: catnet-aar
          path: TMessagesProj/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          [ -n "$SDKMANAGER" ] || { echo "sdkmanager not found under $ANDROID_HOME"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore

      - name: Build APKs and AABs
        env:
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          # The dev variant is <abi>DevStandalone, NOT <abi>DevRelease:
          # `release` is an implicit AGP build type here, with no signingConfig
          # and no standalone sourceSet, so a build on it produces an APK that
          # installs nowhere. See docs/DEV_FLAVOR_PORT_PROBE.md.
          ./gradlew --no-daemon \
            :TMessagesProj_AppStandalone:assembleAarmStoreStandalone \
            :TMessagesProj_AppStandalone:assembleAfatStoreStandalone \
            :TMessagesProj_AppStandalone:assembleAarmDevStandalone \
            :TMessagesProj_AppStandalone:bundleAfatStoreStandalone \
            :TMessagesProj_AppBazaar:assembleAarmStoreBazaar \
            :TMessagesProj_AppBazaar:assembleAfatStoreBazaar \
            :TMessagesProj_AppBazaar:bundleAfatStoreBazaar \
            :TMessagesProj_App:bundleAfatRelease \
            :TMessagesProj_App:assembleAarmRelease

      - name: Collect and verify artifacts
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          CODE="$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building The Cat $VERSION ($CODE)"

          echo "=== outputs tree ==="
          find TMessagesProj_AppStandalone/build/outputs TMessagesProj_AppBazaar/build/outputs \
            TMessagesProj_App/build/outputs \
            -type f \( -name '*.apk' -o -name '*.aab' \) | sort

          # discover outputs instead of hardcoding AGP's directory layout
          pick() {
            local dir="$1" name="$2" pat="${3:-}"
            if [ -n "$pat" ]; then
              find "$dir" -type f -name "$name" -path "*$pat*" | head -1
            else
              find "$dir" -type f -name "$name" | head -1
            fi
          }
          STAND_ARM="$(pick TMessagesProj_AppStandalone/build/outputs/apk app.apk aarmStore)"
          STAND_FAT="$(pick TMessagesProj_AppStandalone/build/outputs/apk app.apk afatStore)"
          STAND_AAB="$(pick TMessagesProj_AppStandalone/build/outputs/bundle app.aab)"
          [ -n "$STAND_AAB" ] || STAND_AAB="$(pick TMessagesProj_AppStandalone/build/outputs '*.aab')"
          BAZAAR_ARM="$(pick TMessagesProj_AppBazaar/build/outputs/apk app.apk aarmStore)"
          BAZAAR_FAT="$(pick TMessagesProj_AppBazaar/build/outputs/apk app.apk afatStore)"
          BAZAAR_AAB="$(pick TMessagesProj_AppBazaar/build/outputs/bundle app.aab)"
          [ -n "$BAZAAR_AAB" ] || BAZAAR_AAB="$(pick TMessagesProj_AppBazaar/build/outputs '*.aab')"
          # The Play distribution. Separate module from the standalone AAB: it
          # carries the Play release manifest (no SEND_SMS) and overrides
          # usesDirectPayments(), so its purchase buttons reach our own checkout
          # instead of Play Billing, which an Iranian merchant cannot use.
          PLAY_AAB="$(pick TMessagesProj_App/build/outputs/bundle app.aab)"
          [ -n "$PLAY_AAB" ] || PLAY_AAB="$(pick TMessagesProj_App/build/outputs '*.aab')"
          # ARM-only APK of the same Play build, for the listing's APK upload
          # path and for anyone sideloading from it. Same applicationId and
          # keystore as the standalone build, so it installs over one in place.
          PLAY_ARM="$(pick TMessagesProj_App/build/outputs/apk app.apk aarmRelease)"
          [ -n "$PLAY_ARM" ] || PLAY_ARM="$(pick TMessagesProj_App/build/outputs/apk '*.apk' aarm)"
          # Dev ships in the release too. Its name carries "DEV" so it can never
          # be mistaken for the store APK; the applicationId differs
          # (com.thecat.messenger.dev, installs side by side) and it talks to the
          # dev backend on :30098, not production on :30001.
          DEV_ARM="$(pick TMessagesProj_AppStandalone/build/outputs/apk app.apk aarmDev)"

          for f in "$STAND_ARM" "$STAND_FAT" "$STAND_AAB" "$PLAY_AAB" "$PLAY_ARM" "$BAZAAR_ARM" "$BAZAAR_FAT" "$BAZAAR_AAB" "$DEV_ARM"; do
            [ -n "$f" ] && [ -f "$f" ] || { echo "ERROR: artifact not found (see tree above)"; exit 1; }
          done

          mkdir -p dist
          cp "$STAND_ARM"  "dist/TheCat-$VERSION-ARM-ZeroHub.apk"
          cp "$STAND_FAT"  "dist/TheCat-$VERSION-ZeroHub.apk"
          cp "$STAND_AAB"  "dist/TheCat-$VERSION-ZeroHub.aab"
          cp "$PLAY_AAB"   "dist/TheCat-$VERSION-Play-ZeroHub.aab"
          cp "$PLAY_ARM"   "dist/TheCat-$VERSION-Play-ARM-ZeroHub.apk"
          cp "$BAZAAR_ARM" "dist/TheCat-$VERSION-Bazaar-ARM-ZeroHub.apk"
          cp "$BAZAAR_FAT" "dist/TheCat-$VERSION-Bazaar-ZeroHub.apk"
          cp "$BAZAAR_AAB" "dist/TheCat-$VERSION-Bazaar-ZeroHub.aab"
          cp "$DEV_ARM"    "dist/TheCat-$VERSION-DEV-Standalone-ARM-ZeroHub.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in dist/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" > /dev/null
            unzip -l "$apk" | grep -q 'lib/.*/libgojni.so' \
              || { echo "catnet native lib missing in $apk"; exit 1; }
            unzip -p "$apk" 'classes*.dex' | strings | grep -q 'catnet/mobile' \
              || { echo "catnet classes missing in $apk"; exit 1; }
          done
          # The Bazaar receipt RPC is defined in the :TMessagesProj library but
          # referenced only by the Bazaar app module, so the library's own R8 pass
          # strips it unless kept there. That is silent at build time and only
          # surfaces as NoClassDefFoundError after a user has paid, so assert it.
          for apk in dist/*Bazaar*.apk; do
            unzip -p "$apk" 'classes*.dex' | strings | grep -q 'TL_payments_assignBazaarTransaction' \
              || { echo "Bazaar receipt RPC stripped from $apk"; exit 1; }
          done

          for aab in dist/*.aab; do
            unzip -l "$aab" | grep -q 'base/lib/.*libgojni.so' \
              || { echo "catnet native lib missing in $aab"; exit 1; }
          done

          # 16 KB page alignment on every native library in the Play AAB. Play
          # rejects a submission whose .so files are 4 KB aligned, and that
          # rejection only happens at upload time — so it is cheaper to fail
          # here. Checks each ELF program header rather than trusting the flags
          # that were asked for, because gomobile's are silently droppable.
          bash scripts/check-16kb-align.sh "dist/TheCat-$VERSION-Play-ZeroHub.aab"

          # Play refuses a bundle whose minSdk is below 24 ("automatic
          # protection requires a minimum SDK version of 24 or higher"), and
          # only at upload time. Read the value back out of the built manifest
          # rather than trusting the gradle file, so a flavor that overrides
          # minSdk cannot quietly reintroduce 21.
          #
          # apkanalyzer, not grep: the manifest inside an AAB is binary XML.
          PLAY_AAB_MIN="$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f 2>/dev/null | head -1)"
          [ -n "$PLAY_AAB_MIN" ] || { echo "apkanalyzer not found under $ANDROID_HOME"; exit 1; }
          PLAY_MIN_SDK="$("$PLAY_AAB_MIN" manifest min-sdk "dist/TheCat-$VERSION-Play-ZeroHub.aab" 2>/dev/null)" || {
            echo "apkanalyzer failed to read the Play AAB minSdk (tool problem, not a build problem)"; exit 1; }
          [ "$PLAY_MIN_SDK" = "24" ] || { echo "Play AAB minSdk is '$PLAY_MIN_SDK', must be 24"; exit 1; }
          echo "Play AAB minSdk: $PLAY_MIN_SDK"

          # Dev-specific checks, beyond the generic signature/catnet loop above
          # which already covered it as part of dist/*.apk. The failure this
          # guards against: an APK built on the implicit `release` build type is
          # unsigned and lacks the standalone AndroidManifest, so it installs
          # nowhere. Both are silent until a device rejects it, so assert the
          # manifest content here.
          # apkanalyzer is found rather than assumed for the same reason
          # sdkmanager is: cmdline-tools is not reliably under `latest`.
          DEV_APK="dist/TheCat-$VERSION-DEV-Standalone-ARM-ZeroHub.apk"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f 2>/dev/null | head -1)"
          [ -n "$APKANALYZER" ] || { echo "apkanalyzer not found under $ANDROID_HOME"; exit 1; }
          # Distinguish "the tool did not run" from "the APK is wrong": the first
          # is an infrastructure problem that must not be reported as a bad build,
          # and vice versa.
          DEV_MANIFEST="$("$APKANALYZER" manifest print "$DEV_APK" 2>/dev/null)" || {
            echo "apkanalyzer failed to read $DEV_APK (tool problem, not a build problem)"; exit 1; }
          [ -n "$DEV_MANIFEST" ] || {
            echo "apkanalyzer produced no manifest for $DEV_APK (tool problem)"; exit 1; }
          # `case` rather than `echo ... | grep -q`: with `pipefail`, grep exiting
          # on its first match can SIGPIPE the writer, and the pipeline then
          # returns nonzero even though the match succeeded. That is a timing
          # race, so it would fail one run in some number — exactly the kind of
          # flake that gets a real assertion deleted. No pipe, no race.
          case "$DEV_MANIFEST" in
            *'package="com.thecat.messenger.dev"'*) ;;
            *) echo "dev APK has the wrong applicationId"; exit 1 ;;
          esac
          case "$DEV_MANIFEST" in
            *'permission.READ_CALL_LOG'*) ;;
            *) echo "dev APK lacks the standalone manifest (READ_CALL_LOG) — wrong build type"; exit 1 ;;
          esac

          ls -la dist/

      - name: Keep build outputs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Fetch build outputs
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          CODE: ${{ needs.build.outputs.code }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$VERSION-$CODE"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "The Cat $VERSION ($CODE)" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
